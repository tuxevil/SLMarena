server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js hashed static assets: immutable
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public snapshot (regenerated per deploy): short-lived cache
    location /data/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Trailing-slash static routes (e.g. /scenarios/index.html)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
