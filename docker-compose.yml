services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slmarena
      POSTGRES_USER: slmarena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - slmarena-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-local-development-only}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - slmarena-redis:/data

volumes:
  slmarena-postgres:
  slmarena-redis:
